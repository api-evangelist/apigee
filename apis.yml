- aid: google-apigee:google-apigee-connect-api
  name: Google Apigee Connect API
  description: >-
    The Apigee Connect API enables Apigee hybrid to connect the Apigee management plane to the customer-managed
    runtime plane without requiring the runtime plane to have an inbound firewall rule. It allows secure
    outbound-only connectivity from the on-premises or private cloud runtime to Google's management services.
  humanURL: https://cloud.google.com/apigee/docs/hybrid/latest/apigee-connect
  baseURL: https://apigeeconnect.googleapis.com
  tags:
  - Administration
  - Connectivity
  - Google Cloud
  - Hybrid
  properties:
  - type: Documentation
    url: https://cloud.google.com/apigee/docs/hybrid/latest/apigee-connect
  - type: Reference
    url: https://cloud.google.com/apigee/docs/reference/apis/apigeeconnect/rest
- aid: google-apigee:google-apigee-api-hub
  name: Google Apigee API Hub
  description: >-
    Apigee API Hub is a centralized repository and governance platform for discovering, managing, and
    analyzing APIs across an organization. It enables teams to register APIs, manage API versions and
    specifications, enforce API standards, and gain visibility into the full API portfolio across multiple
    gateways and environments.
  humanURL: https://cloud.google.com/apigee/docs/apihub/what-is-api-hub
  baseURL: https://apihub.googleapis.com
  tags:
  - API Catalog
  - API Governance

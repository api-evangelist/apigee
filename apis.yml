  name: Google Apigee
  description: >-
    Apigee is Google Cloud's API management platform enabling organizations to design, secure, publish,
    analyze, and scale their APIs with advanced analytics, developer portal, and monetization features.
  humanURL: https://cloud.google.com/apigee
  tags:
  - API Gateway
